<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP - ViaCEP</title>
    <!-- Vinculação do arquivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h2>Consulta de CEP</h2>
        
        <form id="form-cep" action="#">
            <div class="form-group">
                <label for="cep">CEP</label>
                <input name="cep" type="text" id="cep" placeholder="00000-000" maxlength="9" inputmode="numeric" />
            </div>

            <div class="form-group">
                <label for="rua">Rua / Logradouro</label>
                <input name="rua" type="text" id="rua" readonly />
            </div>

            <div class="form-group">
                <label for="bairro">Bairro</label>
                <input name="bairro" type="text" id="bairro" readonly />
            </div>

            <div class="form-row">
                <div class="form-group flex-3">
                    <label for="cidade">Cidade</label>
                    <input name="cidade" type="text" id="cidade" readonly />
                </div>
                <div class="form-group flex-1">
                    <label for="uf">Estado (UF)</label>
                    <input name="uf" type="text" id="uf" readonly />
                </div>
            </div>

            <div class="form-group">
                <label for="ibge">Código IBGE</label>
                <input name="ibge" type="text" id="ibge" readonly />
            </div>
        </form>
    </main>

    <!-- Vinculação do arquivo JavaScript -->
    <script src="cep.js"></script>
</body>
</html>
